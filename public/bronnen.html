  .lang-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  @media (max-width: 640px) { .bw { padding: 20px 16px 48px; } .bw h1 { font-size: 24px; } .bw .opt { display: none; } }

var T = {
  nl: {
    terug: "← Terug naar de tracker", titel: "Bronnen & werkwijze",

    h_werk: "Werkwijze",

    w2: "<strong>Voorselectie.</strong> Een filter scoort elk bericht op relevantie voor Russische militaire ontwikkelingen (TTP's, wapensystemen, organisatie). Bij de brede nieuwsbronnen tellen alleen berichten die dat filter raken.",
    w3: "<strong>Analyse.</strong> Eén keer per dag worden de sterkste kandidaten gelezen in de volledige brontekst. Berichten over dezelfde ontwikkeling worden samengevoegd tot één item met al hun bronnen, met een samenvatting in het Nederlands en Engels en een inschatting van het belang (1–3).",

    k_bron: "Bron", k_labels: "Labels", k_link: "Link", k_nu: "In items nu",

  en: {

};
var taal = "en";
try { taal = localStorage.getItem("rumil_lang") || "en"; } catch (e) {}
var tellingen = null, overig = null, laadfout = false;

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function domein(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }

function render() {
  var t = T[taal] || T.en;
  document.documentElement.lang = taal;
  document.title = t.titel + " — Russian Military Tracker";
  document.querySelectorAll("[data-t]").forEach(function (el) { el.innerHTML = t[el.getAttribute("data-t")] || ""; });
  document.querySelectorAll(".lang-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === taal); });
  document.getElementById("foot").textContent = t.foot;
  var rij = BRONNEN.slice().sort(function (a, b) {
    return (a.stroom === b.stroom ? 0 : a.stroom === "verified" ? -1 : 1) || (b.gewicht - a.gewicht) || a.naam.localeCompare(b.naam);
  }).map(function (b) {
    var tags = '<span class="tag">' + (b.stroom === "verified" ? t.tag_verified : t.tag_single) + "</span>" +
      (b.staat ? '<span class="tag staat">' + t.tag_staat + "</span>" : "") +
      (b.herkomst ? '<span class="tag ' + b.herkomst + '">' + b.herkomst.toUpperCase() + "</span>" : "") +
      (b.telegram ? '<span class="tag">Telegram</span>' : "") + (b.actief ? "" : '<span class="tag uit">' + t.uit + "</span>");
    var n = tellingen ? (tellingen[b.id] || 0) : (laadfout ? "–" : "…");
    return "<tr><td>" + esc(b.naam) + "</td><td>" + tags + '</td><td class="opt">' + (b.url ? '<a href="' + esc(b.url) + '" target="_blank" rel="noopener">' + esc(domein(b.url)) + "</a>" : "–") + '</td><td class="n">' + n + "</td></tr>";
  }).join("");
  document.getElementById("register").innerHTML = "<tr><th>" + t.k_bron + "</th><th>" + t.k_labels + '</th><th class="opt">' + t.k_link + '</th><th style="text-align:right">' + t.k_nu + "</th></tr>" + rij;
  var ov = document.getElementById("overig");
  if (laadfout) ov.innerHTML = "<tr><td>" + t.fout + "</td></tr>";
  else if (!overig) ov.innerHTML = "<tr><td>" + t.laden + "</td></tr>";
  else if (!overig.length) ov.innerHTML = "<tr><td>" + t.geen + "</td></tr>";
  else ov.innerHTML = "<tr><th>" + t.k_domein + '</th><th style="text-align:right">' + t.k_nu + "</th></tr>" +
    overig.map(function (o) { return "<tr><td>" + esc(o[0]) + '</td><td class="n">' + o[1] + "</td></tr>"; }).join("");
}

document.querySelectorAll(".lang-btn").forEach(function (b) {
  b.addEventListener("click", function () { taal = b.getAttribute("data-lang"); try { localStorage.setItem("rumil_lang", taal); } catch (e) {} render(); });
});
render();

fetch("analysis.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (a) {
  // Koppel een verwijzing aan een bron via het bron-id, anders via het domein van de URL
  // (bij zelf gevolgde verwijzingen staat vaak alleen de URL).
  var bekend = {}, perDomein = {};
  var kern = function (h) { return h.replace(/^(www|en|eng|m)\./, ""); };
  // Telegram: koppelen op kanaal (t.me/<kanaal>), niet op domein.
  var kanaal = function (u) { var m = String(u || "").match(/t\.me\/(?:s\/)?([A-Za-z0-9_]+)/); return m ? "t.me/" + m[1].toLowerCase() : null; };
  BRONNEN.forEach(function (b) {
    bekend[b.id] = true;
    if (b.url) perDomein[b.telegram ? kanaal(b.url) : kern(domein(b.url))] = b.id;
  });
  var t = {}, o = {};
  (a.entries || []).forEach(function (e) {
    var gezien = {};
    (e.sourceRefs || []).forEach(function (s) {
      var d = kanaal(s.url) || kern(domein(s.url || ""));
      var sleutel = s.source && bekend[s.source] ? s.source : perDomein[d] || "~" + d;
      if (gezien[sleutel]) return; gezien[sleutel] = true;
      if (sleutel.charAt(0) === "~") { if (sleutel.length > 1) o[sleutel.slice(1)] = (o[sleutel.slice(1)] || 0) + 1; }
      else t[sleutel] = (t[sleutel] || 0) + 1;
    });
  });
  tellingen = t;
  overig = Object.keys(o).map(function (k) { return [k, o[k]]; }).sort(function (x, y) { return y[1] - x[1] || x[0].localeCompare(y[0]); });
  render();
}).catch(function () { laadfout = true; render(); });
</script>
