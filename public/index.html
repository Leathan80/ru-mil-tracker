<script>
/* Vangnet. Eindigt de pagina zonder CSS of zonder JavaScript — bijvoorbeeld doordat een
   service worker een kapotte of half opgeruimde cache serveert — gooi dan eenmalig alle
   workers en caches weg en herlaad. Zonder dit blijft een geinstalleerde app in die
   toestand hangen zolang hij niet met de hand wordt gewist. */
(function () {
  window.addEventListener("load", function () {
    var cssOk = getComputedStyle(document.body).backgroundColor === "rgb(11, 13, 16)";
    var jsOk = !!window.UI_EN;
    if (cssOk && jsOk) return;

    var already;
    try {
      already = sessionStorage.getItem("rumil_heal");
      sessionStorage.setItem("rumil_heal", "1");
    } catch (e) {
      return; // zonder sessionStorage geen zelfherstel: dat zou een herlaadlus riskeren
    }
    if (already) return;

    var reload = function () { location.reload(); };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations && window.caches) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .then(function () { return caches.keys(); })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .then(reload, reload);
    } else {
      reload();
    }
  });
})();
</script>
